name: Ruby CI

on:
    push:
        branches: ["main", "develop"]
        paths:
            - "backend/**"
            - ".github/workflows/ruby.yml"
    pull_request:
        branches: ["main", "develop"]
        paths:
            - "backend/**"
            - ".github/workflows/ruby.yml"
    workflow_call:

jobs:
    scan_ruby:
        runs-on: ubuntu-latest
        name: Security Scan with Brakeman

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Ruby
              uses: ruby/setup-ruby@v1
              with:
                  ruby-version: "3.2"
                  bundler-cache: true
                  working-directory: backend

            - name: Run Brakeman security scan
              run: |
                  cd backend
                  bundle exec brakeman --no-pager --format json --output brakeman-report.json
                  bundle exec brakeman --no-pager

            - name: Upload Brakeman report
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: brakeman-report
                  path: backend/brakeman-report.json

    lint:
        runs-on: ubuntu-latest
        name: Lint with RuboCop

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Ruby
              uses: ruby/setup-ruby@v1
              with:
                  ruby-version: "3.2"
                  bundler-cache: true
                  working-directory: backend

            - name: Run RuboCop
              run: |
                  cd backend
                  bundle exec rubocop --format github

    test:
        runs-on: ubuntu-latest
        name: Test with RSpec

        services:
            sqlite:
                image: ubuntu:latest
                options: --health-cmd "echo 'SQLite service ready'" --health-interval 10s --health-timeout 5s --health-retries 5

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Ruby
              uses: ruby/setup-ruby@v1
              with:
                  ruby-version: "3.2"
                  bundler-cache: true
                  working-directory: backend

            - name: Set up database
              run: |
                  cd backend
                  bundle exec rails db:create RAILS_ENV=test
                  bundle exec rails db:migrate RAILS_ENV=test

            - name: Run tests
              run: |
                  cd backend
                  bundle exec rspec --format documentation --format RspecJunitFormatter --out rspec-results.xml

            - name: Upload test results
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: rspec-results
                  path: backend/rspec-results.xml

    build:
        runs-on: ubuntu-latest
        name: Build Application
        needs: [scan_ruby, lint, test]

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Ruby
              uses: ruby/setup-ruby@v1
              with:
                  ruby-version: "3.2"
                  bundler-cache: true
                  working-directory: backend

            - name: Precompile assets (if needed)
              run: |
                  cd backend
                  bundle exec rails assets:precompile RAILS_ENV=production

            - name: Build success
              run: echo "All checks passed! Application is ready for deployment."
