name: Frontend CI

on:
    push:
        branches: ["main", "develop"]
        paths:
            - "frontend/**"
            - ".github/workflows/frontend.yml"
    pull_request:
        branches: ["main", "develop"]
        paths:
            - "frontend/**"
            - ".github/workflows/frontend.yml"
    workflow_call:

jobs:
    lint:
        runs-on: ubuntu-latest
        name: Lint Frontend Code

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "18"
                  cache: "npm"
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              run: |
                  cd frontend
                  npm ci

            - name: Run ESLint
              run: |
                  cd frontend
                  npm run lint

    test:
        runs-on: ubuntu-latest
        name: Test Frontend Code

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "18"
                  cache: "npm"
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              run: |
                  cd frontend
                  npm ci

            - name: Run tests
              run: |
                  cd frontend
                  npm run test:unit

            - name: Upload coverage reports
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: frontend-coverage
                  path: frontend/coverage/

    build:
        runs-on: ubuntu-latest
        name: Build Frontend
        needs: [lint, test]

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "18"
                  cache: "npm"
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              run: |
                  cd frontend
                  npm ci

            - name: Build application
              run: |
                  cd frontend
                  npm run build

            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: frontend-dist
                  path: frontend/dist/
